<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Тихое место</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Raleway:wght@200;300&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            width:100%; height:100vh; height:100dvh;
            overflow:hidden;
            font-family:"Raleway",sans-serif;
            font-weight:300;
            background:#0a0a0f;
            display:flex;
            justify-content:center;
            align-items:center;
            color:white;
        }
        .rain-bg {
            position:fixed; top:0; left:0;
            width:100%; height:100%;
            background: url('rain-bg.jpg') center/cover no-repeat;
            filter: brightness(0.4) blur(3px);
            z-index:0;
        }
        .rain-overlay {
            position:fixed; top:0; left:0;
            width:100%; height:100%;
            background: rgba(0,0,0,0.5);
            z-index:1;
        }
        .quiet-content {
            position:relative; z-index:2;
            text-align:center;
            padding:20px;
        }
        .quiet-content h1 {
            font-family:"Cormorant Garamond",serif;
            font-weight:300;
            font-size:36px;
            color:#c0d0e0;
            margin-bottom:12px;
            letter-spacing:3px;
        }
        .quiet-content p {
            font-size:16px;
            color:rgba(200,210,230,0.7);
            line-height:1.8;
            max-width:400px;
        }
        .back-btn {
            margin-top:30px;
            padding:12px 32px;
            border-radius:30px;
            border:1px solid rgba(255,255,255,0.2);
            background:rgba(255,255,255,0.05);
            color:white;
            font-size:14px;
            cursor:pointer;
            backdrop-filter:blur(10px);
            transition:0.4s;
            font-family:"Raleway",sans-serif;
            font-weight:300;
            letter-spacing:2px;
        }
        .back-btn:hover {
            background:rgba(255,255,255,0.12);
            border-color:rgba(150,180,220,0.6);
            box-shadow:0 0 20px rgba(100,140,200,0.3);
        }
    </style>
</head>
<body>
    <div class="rain-bg"></div>
    <div class="rain-overlay"></div>
    <div class="quiet-content">
        <h1>Тихое место</h1>
        <p>Здесь будет что-то очень атмосферное...</p>
        <button class="back-btn" onclick="window.location.href='index.html'">Вернуться обратно 🌙</button>
    </div>
    <audio loop autoplay>
        <source src="rain.mp3" type="audio/mpeg">
    </audio>
</body>
</html>
