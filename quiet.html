<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Тихое место 🌧</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Raleway:wght@200;300;400&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            width:100%; height:100vh; height:100dvh;
            overflow:hidden;
            font-family:"Raleway",sans-serif;
            font-weight:300;
            background:#020208;
            color:white;
            -webkit-tap-highlight-color:transparent;
            user-select:none;
            -webkit-user-select:none;
        }
        .bg {
            position:fixed; top:0; left:0;
            width:100%; height:100%;
            z-index:0;
            background:
                radial-gradient(ellipse at 30% 70%, rgba(20,10,30,0.8) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 30%, rgba(15,5,25,0.9) 0%, transparent 55%),
                linear-gradient(to bottom, #020208, #050510);
        }
        .rain-glass {
            position:fixed; top:0; left:0;
            width:100%; height:100%;
            z-index:5;
            pointer-events:none;
        }
        .raindrop {
            position:absolute;
            width:1.5px;
            background:linear-gradient(to bottom, rgba(200,210,240,0.5), rgba(180,200,230,0.05));
            border-radius:0 0 2px 2px;
            animation:rainFall linear infinite;
        }
        @keyframes rainFall {
            0% { transform:translateY(-10vh); opacity:0; }
            5% { opacity:1; }
            95% { opacity:0.6; }
            100% { transform:translateY(110vh); opacity:0; }
        }
        .petals {
            position:fixed; top:0; left:0;
            width:100%; height:100%;
            z-index:4;
            pointer-events:none;
        }
        .petal {
            position:absolute;
            top:-30px;
            font-size:18px;
            color:rgba(60,10,40,0.7);
            filter:drop-shadow(0 0 4px rgba(100,20,60,0.4));
            animation:petalFall linear forwards;
            opacity:0;
        }
        @keyframes petalFall {
            0% { transform:translateY(0) translateX(0) rotate(0deg) scale(0.8); opacity:0; }
            10% { opacity:0.9; }
            30% { transform:translateY(20vh) translateX(-20px) rotate(45deg) scale(0.9); }
            60% { transform:translateY(55vh) translateX(30px) rotate(180deg) scale(1); }
            90% { opacity:0.5; }
            100% { transform:translateY(105vh) translateX(-10px) rotate(360deg) scale(0.3); opacity:0; }
        }
        .content {
            position:relative;
            z-index:10;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            height:100%;
            padding:20px;
            text-align:center;
        }
        .glass-card {
            background:rgba(10,5,20,0.4);
            backdrop-filter:blur(20px);
            -webkit-backdrop-filter:blur(20px);
            border:1px solid rgba(255,255,255,0.06);
            border-radius:28px;
            padding:32px 24px;
            max-width:420px;
            width:100%;
            box-shadow:0 20px 60px rgba(0,0,0,0.6);
        }
        .glass-card h1 {
            font-family:"Cormorant Garamond",serif;
            font-weight:300;
            font-size:36px;
            color:#c8d0e8;
            margin-bottom:16px;
            letter-spacing:3px;
        }
        .volume-control {
            display:flex;
            align-items:center;
            gap:10px;
            margin-top:20px;
            justify-content:center;
        }
        .volume-icon { font-size:18px; }
        .volume-slider {
            -webkit-appearance:none;
            width:120px;
            height:3px;
            border-radius:3px;
            background:rgba(255,255,255,0.2);
            outline:none;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance:none;
            width:16px; height:16px;
            border-radius:50%;
            background:rgba(180,200,240,0.9);
            cursor:pointer;
            box-shadow:0 0 8px rgba(150,180,220,0.5);
        }
        .back-btn {
            margin-top:24px;
            padding:12px 32px;
            border-radius:30px;
            border:1px solid rgba(255,255,255,0.2);
            background:rgba(255,255,255,0.05);
            color:white;
            font-size:14px;
            cursor:pointer;
            backdrop-filter:blur(10px);
            transition:0.4s;
            font-family:"Raleway",sans-serif;
            font-weight:300;
            letter-spacing:2px;
        }
        .back-btn:hover {
            background:rgba(255,255,255,0.12);
            border-color:rgba(150,180,220,0.6);
            box-shadow:0 0 20px rgba(100,140,200,0.3);
        }
        @media (max-width:600px) {
            .glass-card { padding:24px 16px; }
            .glass-card h1 { font-size:28px; }
            .volume-slider { width:100px; }
        }
    </style>
</head>
<body>
    <div class="bg"></div>
    <div class="rain-glass" id="rainGlass"></div>
    <div class="petals" id="petals"></div>
    <div class="content">
        <div class="glass-card">
            <h1>Тихое место</h1>
            <div class="volume-control">
                <span class="volume-icon">🌧</span>
                <input type="range" class="volume-slider" id="rainVolume" min="0" max="100" value="40">
                <span class="volume-icon">🔊</span>
            </div>
            <button class="back-btn" onclick="window.location.href='index.html'">Вернуться обратно 🌙</button>
        </div>
    </div>
    <audio id="rainAudio" loop><source src="rain.mp3" type="audio/mpeg"></audio>
    <audio id="lofiAudio" loop><source src="https://cdn.pixabay.com/audio/2022/10/25/audio_946f2a53c2.mp3" type="audio/mpeg"></audio>
    <script>
        (function(){
            var g=document.getElementById('rainGlass');
            for(var i=0;i<100;i++){
                var d=document.createElement('div');
                d.className='raindrop';
                d.style.left=Math.random()*100+'%';
                d.style.top=Math.random()*100+'%';
                d.style.height=(Math.random()*12+6)+'px';
                d.style.opacity=Math.random()*0.5+0.2;
                d.style.animationDuration=(Math.random()*0.7+0.4)+'s';
                d.style.animationDelay=Math.random()*2+'s';
                g.appendChild(d);
            }
            setInterval(function(){
                var d=document.createElement('div');
                d.className='raindrop';
                d.style.left=Math.random()*100+'%';
                d.style.top='-5%';
                d.style.height=(Math.random()*12+6)+'px';
                d.style.opacity=Math.random()*0.5+0.2;
                d.style.animationDuration=(Math.random()*0.7+0.4)+'s';
                g.appendChild(d);
                setTimeout(function(){ d.remove(); },1500);
            },70);
        })();
        (function(){
            var c=document.getElementById('petals');
            function p(){
                var d=document.createElement('div');
                d.className='petal';
                d.innerHTML=['🥀','🖤','💜','🌑'][Math.floor(Math.random()*4)];
                d.style.left=Math.random()*100+'%';
                d.style.fontSize=(Math.random()*14+12)+'px';
                d.style.animationDuration=(Math.random()*10+8)+'s';
                c.appendChild(d);
                setTimeout(function(){ d.remove(); },18000);
            }
            setInterval(p,1200);
            for(var i=0;i<6;i++) setTimeout(p,i*500);
        })();
        (function(){
            var rain=document.getElementById('rainAudio');
            var lofi=document.getElementById('lofiAudio');
            var slider=document.getElementById('rainVolume');
            rain.volume=0.4; lofi.volume=0.18;
            document.addEventListener('click',function(){
                rain.play().catch(function(){});
                lofi.play().catch(function(){});
            },{once:true});
            slider.addEventListener('input',function(){
                rain.volume=this.value/100;
            });
        })();
    </script>
</body>
</html>
